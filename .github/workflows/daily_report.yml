name: 惠州店经营日报

on:
  schedule:
    # GitHub Actions 的 cron 一律用 UTC。北京时间 = UTC + 8
    #
    # 为什么 cron 定 20:10 却写「22:12 开跑」：
    #   GitHub 免费版 schedule 不是准点执行 —— 它把任务丢进队列，实测延迟 5 分钟到
    #   近 1 小时（11-04 那次 22:07 触发，run 到 22:56 才建出来，到群 23:00）。
    #   所以 cron 定几点，决定不了群里几点收到。
    # 现在的做法：cron 提前约 2 小时触发，任务启动后原地等到北京时间目标点才开始拉数据，
    #   把排队/延迟全部吸收进等待时间 —— 不管早到还是晚到，都准点开跑。
    # ⚠️ 2026-11-25 老板改时间：工作日（周一~周五）21:30 开跑；周末 22:00 开跑。
    #   门店 21:30 营业结束，21:30 起拉数据能收到当日全量流水；
    #   图片约 2~4 分钟后到群（拉数+画图+归档+CDN）。
    - cron: '30 11 * * 1-5'   # 工作日 19:30 触发 → 等到 21:30 开跑
    - cron: '0 12 * * 6,0'    # 周末   20:00 触发 → 等到 22:00 开跑
  workflow_dispatch:          # 手动补跑：Actions 页面点 Run workflow
    inputs:
      date:
        description: '日报日期 YYYY-MM-DD，留空=今天（留空会等到当日目标时间再跑）'
        required: false
        default: ''
      dry_run:
        description: '试跑（只生成图验证，不归档不推群）'
        required: false
        default: 'false'

permissions:
  contents: write

# 同一时间只允许一个任务在跑，避免两个任务同时 git push 撞 ref 锁，
# 也保证「今日已推送」的幂等锁串行生效
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # 最长约 2 小时等待（吸收 cron 延迟），所以总超时要放宽
    timeout-minutes: 200

    steps:
      - uses: actions/checkout@v4

      - name: 准备中文字体
        # 2026-11-26 加固：不同 runner 镜像的 CJK 字体路径不一致，曾触发渲染
        # 扫描兜底误选 NotoColorEmoji 位图字体（invalid pixel size）。
        # 现在首选把 Noto Sans SC 固定下载到 ~/.fonts（渲染代码里该路径最优先），
        # 彻底与镜像解耦；jsDelivr 失败才回退 apt。
        run: |
          mkdir -p ~/.fonts
          ok=1
          curl -fsSL --max-time 180 -o ~/.fonts/NotoSansSC-Regular.otf \
            "https://cdn.jsdelivr.net/gh/googlefonts/noto-cjk@main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf" || ok=0
          curl -fsSL --max-time 180 -o ~/.fonts/NotoSansSC-Bold.otf \
            "https://cdn.jsdelivr.net/gh/googlefonts/noto-cjk@main/Sans/SubsetOTF/SC/NotoSansSC-Bold.otf" || ok=0
          # 断流会产生半截文件，小于 1MB 视为损坏并删除
          for f in ~/.fonts/NotoSansSC-Regular.otf ~/.fonts/NotoSansSC-Bold.otf; do
            sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$sz" -lt 1000000 ]; then rm -f "$f"; ok=0; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::字体下载失败，改用 apt 安装 fonts-noto-cjk"
            sudo apt-get update -qq -o Acquire::http::Timeout=25 -o Acquire::Retries=2 || true
            sudo timeout 240 apt-get install -y --no-install-recommends fonts-noto-cjk \
              || echo "::warning::apt 安装字体也失败（渲染将走系统扫描兜底）"
          fi
          fc-cache -f >/dev/null 2>&1 || true
          ls -l ~/.fonts/ || true
          fc-list 2>/dev/null | grep -iE 'CJK|Noto Sans SC' | head -3 \
            || echo "::warning::未检测到 CJK 字体，渲染可能缺字"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 等到当日目标时间（工作日 21:30 / 周末 22:00，吸收 GitHub cron 延迟）
        # 定时触发、以及「手动跑今天」时都要等；只有补跑历史日期才立刻跑
        if: github.event_name == 'schedule' || github.event.inputs.date == ''
        run: |
          python - <<'PY'
          import datetime, sys, time

          MAX_WAIT = 150 * 60                  # 等待上限，异常情况不无限挂

          # 一律用北京时间判断，避免 UTC 跨日算错
          now_utc = datetime.datetime.now(datetime.timezone.utc)
          bj = now_utc + datetime.timedelta(hours=8)
          workday = bj.weekday() < 5           # 0=周一 … 6=周日
          target_h, target_m = (21, 30) if workday else (22, 0)
          tgt = bj.replace(hour=target_h, minute=target_m,
                           second=0, microsecond=0)
          wait = (tgt - bj).total_seconds()

          label = "工作日 21:30" if workday else "周末 22:00"
          if wait <= 0:
              print(f"当前北京 {bj:%H:%M}，已过目标 {label}，立即开始（说明今天延迟较大）")
              sys.exit(0)
          if wait > MAX_WAIT:
              print(f"距目标还有 {wait/60:.0f} 分钟，超过等待上限，立即开始")
              sys.exit(0)

          print(f"当前北京 {bj:%H:%M}，等待 {wait:.0f} 秒（{wait/60:.0f} 分钟）到{label}")
          time.sleep(int(wait))
          bj2 = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=8)
          print(f"已到北京时间 {bj2:%H:%M}，开始拉当日数据")
          PY

      - name: 今日是否已推送（幂等锁，防重复发群）
        id: dup
        # dry_run 试跑不走锁：目的就是验证生成环节，锁反而会把它跳过
        if: github.event.inputs.dry_run != 'true'
        run: |
          DAY=$(TZ=Asia/Shanghai date +%F)
          if [ -n "${{ github.event.inputs.date }}" ]; then DAY="${{ github.event.inputs.date }}"; fi
          git fetch -q origin main || true
          if git cat-file -e "origin/main:reports/.sent-$DAY" 2>/dev/null; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::$DAY 的日报已经推送过，本次跳过（避免群里收到两遍）"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
            echo "$DAY 尚未推送，继续"
          fi

      - name: 生成日报图
        if: steps.dup.outputs.skip != '1'
        env:
          MODA_ACCOUNT: ${{ secrets.MODA_ACCOUNT }}
          MODA_PASSWORD: ${{ secrets.MODA_PASSWORD }}
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then D=$(TZ=Asia/Shanghai date +%F); fi
          # 偶发网络抖动导致整份日报失败太亏，失败歇 30 秒再试一次
          python daily_report.py $D || {
            echo "::warning::首次生成失败，30 秒后自动重试"
            sleep 30
            python daily_report.py $D
          }
          # 2026-11-28 加固：目标日图不存在说明数据/生成出了岔子，绝不能往下走
          ls output/report_${D}_*.png >/dev/null 2>&1 \
            || { echo "::error::output 缺少 ${D} 的日报图片，终止推送"; exit 1; }

      - name: 归档图片供 CDN 分发
        if: steps.dup.outputs.skip != '1' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "daily-report-bot"
          git config user.email "bot@users.noreply.github.com"

          # 每次都基于远端最新提交重建：两个任务同时 push 时，
          # 后一个会拿到 "cannot lock ref ... expected xxx" 的拒绝，
          # 单次 push 会直接失败并跳过后面的钉钉推送（2026-11-02 就这么漏发的）。
          ok=0
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p reports
            cp -f output/report_*.png reports/
            # 只保留最近 14 天（3 张 × 14 天 = 42 张），避免仓库无限膨胀
            ls -1t reports/*.png 2>/dev/null | tail -n +43 | xargs -r rm -f
            # 幂等标记：推送成功后这里会被提交，第二次运行看到就跳过
            touch "reports/.sent-$(TZ=Asia/Shanghai date +%F)"
            ls -1 reports/.sent-* 2>/dev/null | head -n -14 | xargs -r rm -f
            git add -A reports
            if git diff --cached --quiet; then
              echo "第 $i 次：远端已有这些图，无需提交"
              ok=1
              break
            fi
            git commit -q -m "日报图 $(TZ=Asia/Shanghai date +%F)"
            if git push -q origin main; then
              echo "第 $i 次：推送成功"
              ok=1
              break
            fi
            echo "第 $i 次推送被拒，5 秒后重试…"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::图片没能提交到仓库，CDN 取不到图，本次不发"
            exit 1
          fi

          # 变量名必须与 push_cloud.py 读取的 IMAGE_SHA 完全一致。
          # 且必须是图片已存在的那个 commit：GITHUB_SHA 指向的是提交前的旧 commit，拿它拼 CDN 会 404。
          echo "IMAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "reports 目录现有 $(ls -1 reports/*.png | wc -l) 张图"

      - name: 推送到钉钉群
        if: steps.dup.outputs.skip != '1' && github.event.inputs.dry_run != 'true'
        env:
          DINGTALK_WEBHOOK_TOKEN: ${{ secrets.DINGTALK_WEBHOOK_TOKEN }}
          # 第二个群（惠州流程执行群A）的机器人 token；没配就只发主群
          DINGTALK_WEBHOOK_TOKEN2: ${{ secrets.DINGTALK_WEBHOOK_TOKEN2 }}
          DINGTALK_WEBHOOK_SECRET: ${{ secrets.DINGTALK_WEBHOOK_SECRET }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python cloud/push_cloud.py "${{ github.event.inputs.date }}"
          else
            python cloud/push_cloud.py
          fi

      # 任何一步失败都要出声音，否则就是"群里没收到、也没人知道"
      - name: 失败告警
        if: failure()
        env:
          DINGTALK_WEBHOOK_TOKEN: ${{ secrets.DINGTALK_WEBHOOK_TOKEN }}
          DINGTALK_WEBHOOK_SECRET: ${{ secrets.DINGTALK_WEBHOOK_SECRET }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python cloud/alert.py
