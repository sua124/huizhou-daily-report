name: 惠州店经营日报

on:
  schedule:
    # GitHub Actions 的 cron 一律用 UTC。北京时间 = UTC + 8
    #
    # 为什么 cron 提前到 21 点而不是直接写 22:20：
    #   GitHub 免费版 schedule 不是准点执行，而是把任务丢进队列，实测排队 5~48 分钟
    #   （22:00 那批被延迟到 22:47 才开跑）。所以「cron 定几点」根本决定不了「几点到群」。
    # 现在的做法：cron 提前 60 分钟触发，任务启动后先原地等到北京时间 22:12 再开始拉数据，
    #   把排队延迟全部吸收进等待时间里 —— 不管排队 3 分钟还是 50 分钟，都是 22:12 开始跑。
    # 加班/打烊：22:00 收档，22:12 拉数据保证当日流水已结完，不会少算最后一小时。
    - cron: '5 13 * * 1-5'    # 工作日：21:05 触发，等到 22:12 开跑
    - cron: '15 13 * * 6,0'   # 周末：  21:15 触发，等到 22:12 开跑
  workflow_dispatch:          # 手动补跑：Actions 页面点 Run workflow
    inputs:
      date:
        description: '日报日期 YYYY-MM-DD，留空=今天'
        required: false
        default: ''

permissions:
  contents: write

# 同一时间只允许一个任务在跑，避免两个任务同时 git push 撞 ref 锁
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # 里面有一次最长约 67 分钟的等待（吸收 cron 排队），所以总超时要放宽
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4

      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-list | grep -i cjk | head -3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 等到北京时间 22:12（吸收 GitHub cron 排队延迟）
        # 只在定时触发时等待；手动 Run workflow（含补跑历史日期）要立刻跑，不能等
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import datetime, sys, time

          TARGET_H, TARGET_M = 14, 12          # UTC 14:12 = 北京 22:12
          MAX_WAIT = 80 * 60                   # 等待上限，防止异常情况一直挂着

          now = datetime.datetime.now(datetime.timezone.utc)
          tgt = now.replace(hour=TARGET_H, minute=TARGET_M, second=0, microsecond=0)
          wait = (tgt - now).total_seconds()

          if wait <= 0:
              print(f"当前 UTC {now:%H:%M}，已过目标时间，立即开始（可能排队较久）")
              sys.exit(0)
          if wait > MAX_WAIT:
              print(f"距目标还有 {wait/60:.0f} 分钟，超过等待上限，立即开始")
              sys.exit(0)

          print(f"当前 UTC {now:%H:%M}，等待 {wait:.0f} 秒（{wait/60:.0f} 分钟）到北京 22:12")
          time.sleep(int(wait))
          print(f"已到 {datetime.datetime.now(datetime.timezone.utc):%H:%M} UTC，开始拉当日数据")
          PY

      - name: 生成日报图
        env:
          MODA_ACCOUNT: ${{ secrets.MODA_ACCOUNT }}
          MODA_PASSWORD: ${{ secrets.MODA_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python daily_report.py "${{ github.event.inputs.date }}"
          else
            python daily_report.py
          fi

      - name: 归档图片供 CDN 分发
        run: |
          git config user.name  "daily-report-bot"
          git config user.email "bot@users.noreply.github.com"

          # 每次都基于远端最新提交重建：两个任务同时 push 时，
          # 后一个会拿到 "cannot lock ref ... expected xxx" 的拒绝，
          # 单次 push 会直接失败并跳过后面的钉钉推送（2026-11-02 就这么漏发的）。
          ok=0
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p reports
            cp -f output/report_*.png reports/
            # 只保留最近 14 天（3 张 × 14 天 = 42 张），避免仓库无限膨胀
            ls -1t reports/*.png 2>/dev/null | tail -n +43 | xargs -r rm -f
            git add -A reports
            if git diff --cached --quiet; then
              echo "第 $i 次：远端已有这些图，无需提交"
              ok=1
              break
            fi
            git commit -q -m "日报图 $(date +%F)"
            if git push -q origin main; then
              echo "第 $i 次：推送成功"
              ok=1
              break
            fi
            echo "第 $i 次推送被拒，5 秒后重试…"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::图片没能提交到仓库，CDN 取不到图，本次不发"
            exit 1
          fi

          # 变量名必须与 push_cloud.py 读取的 IMAGE_SHA 完全一致。
          # 且必须是图片已存在的那个 commit：GITHUB_SHA 指向的是提交前的旧 commit，拿它拼 CDN 会 404。
          echo "IMAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "reports 目录现有 $(ls -1 reports/*.png | wc -l) 张图"

      - name: 推送到钉钉群
        env:
          DINGTALK_WEBHOOK_TOKEN: ${{ secrets.DINGTALK_WEBHOOK_TOKEN }}
          DINGTALK_WEBHOOK_SECRET: ${{ secrets.DINGTALK_WEBHOOK_SECRET }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python cloud/push_cloud.py "${{ github.event.inputs.date }}"
          else
            python cloud/push_cloud.py
          fi

      # 任何一步失败都要出声音，否则就是"群里没收到、也没人知道"
      - name: 失败告警
        if: failure()
        env:
          DINGTALK_WEBHOOK_TOKEN: ${{ secrets.DINGTALK_WEBHOOK_TOKEN }}
          DINGTALK_WEBHOOK_SECRET: ${{ secrets.DINGTALK_WEBHOOK_SECRET }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python cloud/alert.py
