name: 惠州店经营日报

on:
  schedule:
    # GitHub Actions 的 cron 一律用 UTC。北京时间 = UTC + 8
    #
    # 为什么 cron 定 20:10 却写「22:12 开跑」：
    #   GitHub 免费版 schedule 不是准点执行 —— 它把任务丢进队列，实测延迟 5 分钟到
    #   近 1 小时（11-04 那次 22:07 触发，run 到 22:56 才建出来，到群 23:00）。
    #   所以 cron 定几点，决定不了群里几点收到。
    # 现在的做法：cron 提前 2 小时触发，任务启动后原地等到北京 22:12 才开始拉数据，
    #   把排队/延迟全部吸收进等待时间 —— 不管早到还是晚到，都是 22:12 开跑、22:20 前后到群。
    # 22:00 收档，22:12 拉数据能保证当日流水已结完，不会少算尾段。
    - cron: '10 12 * * 1-5'   # 工作日 20:10 触发 → 等到 22:12 开跑
    - cron: '20 12 * * 6,0'   # 周末   20:20 触发 → 等到 22:12 开跑
  workflow_dispatch:          # 手动补跑：Actions 页面点 Run workflow
    inputs:
      date:
        description: '日报日期 YYYY-MM-DD，留空=今天（留空会等到 22:12 再跑）'
        required: false
        default: ''
      dry_run:
        description: '试跑（只生成图验证，不归档不推群）'
        required: false
        default: 'false'

permissions:
  contents: write

# 同一时间只允许一个任务在跑，避免两个任务同时 git push 撞 ref 锁，
# 也保证「今日已推送」的幂等锁串行生效
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # 最长约 2 小时等待（吸收 cron 延迟），所以总超时要放宽
    timeout-minutes: 200

    steps:
      - uses: actions/checkout@v4

      - name: 准备中文字体
        # 2026-11-05：apt 卡了 15 分钟把整条流水线堵死（concurrency 又会阻塞后面的 run），
        # 所以这里改成：有字体就跳过、apt 带超时、失败了用 GitHub 直连兜底，绝不让渲染断掉。
        run: |
          if fc-list 2>/dev/null | grep -qiE 'Noto Sans CJK|Source Han|WenQuanYi'; then
            echo "镜像已自带中文字体，跳过安装"
          else
            sudo apt-get update -qq -o Acquire::http::Timeout=25 -o Acquire::Retries=2 || true
            sudo timeout 240 apt-get install -y --no-install-recommends fonts-noto-cjk \
              || echo "::warning::apt 安装字体失败，改用直连下载"
          fi
          if ! fc-list 2>/dev/null | grep -qiE 'Noto Sans CJK|Source Han'; then
            mkdir -p ~/.fonts
            curl -fsSL --max-time 180 -o ~/.fonts/NotoSansSC.otf \
              "https://cdn.jsdelivr.net/gh/googlefonts/noto-cjk@main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf" \
              || echo "::warning::字体兜底下载也失败"
            fc-cache -f >/dev/null 2>&1 || true
          fi
          fc-list | grep -i cjk | head -3 || echo "::warning::未检测到 CJK 字体，渲染可能缺字"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 等到北京时间 22:12（吸收 GitHub cron 延迟）
        # 定时触发、以及「手动跑今天」时都要等；只有补跑历史日期才立刻跑
        if: github.event_name == 'schedule' || github.event.inputs.date == ''
        run: |
          python - <<'PY'
          import datetime, sys, time

          TARGET_H, TARGET_M = 14, 12          # UTC 14:12 = 北京 22:12
          MAX_WAIT = 150 * 60                  # 等待上限，异常情况不无限挂

          now = datetime.datetime.now(datetime.timezone.utc)
          tgt = now.replace(hour=TARGET_H, minute=TARGET_M, second=0, microsecond=0)
          wait = (tgt - now).total_seconds()

          if wait <= 0:
              print(f"当前 UTC {now:%H:%M}，已过 22:12，立即开始（说明今天延迟较大）")
              sys.exit(0)
          if wait > MAX_WAIT:
              print(f"距目标还有 {wait/60:.0f} 分钟，超过等待上限，立即开始")
              sys.exit(0)

          print(f"当前 UTC {now:%H:%M}，等待 {wait:.0f} 秒（{wait/60:.0f} 分钟）到北京 22:12")
          time.sleep(int(wait))
          print(f"已到 {datetime.datetime.now(datetime.timezone.utc):%H:%M} UTC，开始拉当日数据")
          PY

      - name: 今日是否已推送（幂等锁，防重复发群）
        id: dup
        # dry_run 试跑不走锁：目的就是验证生成环节，锁反而会把它跳过
        if: github.event.inputs.dry_run != 'true'
        run: |
          DAY=$(TZ=Asia/Shanghai date +%F)
          if [ -n "${{ github.event.inputs.date }}" ]; then DAY="${{ github.event.inputs.date }}"; fi
          git fetch -q origin main || true
          if git cat-file -e "origin/main:reports/.sent-$DAY" 2>/dev/null; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::$DAY 的日报已经推送过，本次跳过（避免群里收到两遍）"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
            echo "$DAY 尚未推送，继续"
          fi

      - name: 生成日报图
        if: steps.dup.outputs.skip != '1'
        env:
          MODA_ACCOUNT: ${{ secrets.MODA_ACCOUNT }}
          MODA_PASSWORD: ${{ secrets.MODA_PASSWORD }}
        run: |
          D="${{ github.event.inputs.date }}"
          # 偶发网络抖动导致整份日报失败太亏，失败歇 30 秒再试一次
          python daily_report.py $D || {
            echo "::warning::首次生成失败，30 秒后自动重试"
            sleep 30
            python daily_report.py $D
          }

      - name: 归档图片供 CDN 分发
        if: steps.dup.outputs.skip != '1' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "daily-report-bot"
          git config user.email "bot@users.noreply.github.com"

          # 每次都基于远端最新提交重建：两个任务同时 push 时，
          # 后一个会拿到 "cannot lock ref ... expected xxx" 的拒绝，
          # 单次 push 会直接失败并跳过后面的钉钉推送（2026-11-02 就这么漏发的）。
          ok=0
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p reports
            cp -f output/report_*.png reports/
            # 只保留最近 14 天（3 张 × 14 天 = 42 张），避免仓库无限膨胀
            ls -1t reports/*.png 2>/dev/null | tail -n +43 | xargs -r rm -f
            # 幂等标记：推送成功后这里会被提交，第二次运行看到就跳过
            touch "reports/.sent-$(TZ=Asia/Shanghai date +%F)"
            ls -1 reports/.sent-* 2>/dev/null | head -n -14 | xargs -r rm -f
            git add -A reports
            if git diff --cached --quiet; then
              echo "第 $i 次：远端已有这些图，无需提交"
              ok=1
              break
            fi
            git commit -q -m "日报图 $(TZ=Asia/Shanghai date +%F)"
            if git push -q origin main; then
              echo "第 $i 次：推送成功"
              ok=1
              break
            fi
            echo "第 $i 次推送被拒，5 秒后重试…"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::图片没能提交到仓库，CDN 取不到图，本次不发"
            exit 1
          fi

          # 变量名必须与 push_cloud.py 读取的 IMAGE_SHA 完全一致。
          # 且必须是图片已存在的那个 commit：GITHUB_SHA 指向的是提交前的旧 commit，拿它拼 CDN 会 404。
          echo "IMAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "reports 目录现有 $(ls -1 reports/*.png | wc -l) 张图"

      - name: 推送到钉钉群
        if: steps.dup.outputs.skip != '1' && github.event.inputs.dry_run != 'true'
        env:
          DINGTALK_WEBHOOK_TOKEN: ${{ secrets.DINGTALK_WEBHOOK_TOKEN }}
          DINGTALK_WEBHOOK_SECRET: ${{ secrets.DINGTALK_WEBHOOK_SECRET }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python cloud/push_cloud.py "${{ github.event.inputs.date }}"
          else
            python cloud/push_cloud.py
          fi

      # 任何一步失败都要出声音，否则就是"群里没收到、也没人知道"
      - name: 失败告警
        if: failure()
        env:
          DINGTALK_WEBHOOK_TOKEN: ${{ secrets.DINGTALK_WEBHOOK_TOKEN }}
          DINGTALK_WEBHOOK_SECRET: ${{ secrets.DINGTALK_WEBHOOK_SECRET }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python cloud/alert.py
