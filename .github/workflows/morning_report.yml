name: 惠州店经营日报·晨间复核

on:
  schedule:
    # 每天 UTC 23:00（北京 07:00）触发，任务启动后原地等到北京 09:00 才拉数据。
    # 和晚报同一个套路：cron 提前触发占队，把 GitHub 排队延迟全部吸收进等待时间。
    # ⚠️ 2026-11-25 老板把复核时间从 10:00 提前到 09:00，统一每天（含周末）。
    - cron: '0 23 * * *'
  workflow_dispatch:          # 手动补跑：Actions 页面点 Run workflow
    inputs:
      date:
        description: '复核日期 YYYY-MM-DD，留空=昨天'
        required: false
        default: ''
      dry_run:
        description: '试跑（只生成图验证，不归档不推群）'
        required: false
        default: 'false'

permissions:
  contents: write

# 与晚报分开的并发组：两者相隔 12 小时不会重叠；
# 万一手动补跑和定时撞车，同组内排队而不是互相踢掉
concurrency:
  group: morning-report
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
      - uses: actions/checkout@v4

      - name: 准备中文字体
        # 2026-11-26 加固：与晚报同款——首选 ~/.fonts 固定字体，与 runner 镜像解耦
        run: |
          mkdir -p ~/.fonts
          ok=1
          curl -fsSL --max-time 180 -o ~/.fonts/NotoSansSC-Regular.otf \
            "https://cdn.jsdelivr.net/gh/googlefonts/noto-cjk@main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf" || ok=0
          curl -fsSL --max-time 180 -o ~/.fonts/NotoSansSC-Bold.otf \
            "https://cdn.jsdelivr.net/gh/googlefonts/noto-cjk@main/Sans/SubsetOTF/SC/NotoSansSC-Bold.otf" || ok=0
          # 断流会产生半截文件，小于 1MB 视为损坏并删除
          for f in ~/.fonts/NotoSansSC-Regular.otf ~/.fonts/NotoSansSC-Bold.otf; do
            sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$sz" -lt 1000000 ]; then rm -f "$f"; ok=0; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::字体下载失败，改用 apt 安装 fonts-noto-cjk"
            sudo apt-get update -qq -o Acquire::http::Timeout=25 -o Acquire::Retries=2 || true
            sudo timeout 240 apt-get install -y --no-install-recommends fonts-noto-cjk \
              || echo "::warning::apt 安装字体也失败（渲染将走系统扫描兜底）"
          fi
          fc-cache -f >/dev/null 2>&1 || true
          ls -l ~/.fonts/ || true
          fc-list 2>/dev/null | grep -iE 'CJK|Noto Sans SC' | head -3 \
            || echo "::warning::未检测到 CJK 字体，渲染可能缺字"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 确定复核日期（默认昨天）
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then D=$(TZ=Asia/Shanghai date -d yesterday +%F); fi
          echo "RPT_DATE=$D" >> "$GITHUB_ENV"
          echo "本次晨间复核日期：$D"

      - name: 等到北京时间 09:00（吸收 GitHub cron 延迟）
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import datetime, sys, time

          MAX_WAIT = 150 * 60                  # 等待上限，异常情况不无限挂

          # 用北京时间判断，cron 在 UTC 前一天 23:00 触发也不会算错
          now_utc = datetime.datetime.now(datetime.timezone.utc)
          bj = now_utc + datetime.timedelta(hours=8)
          tgt = bj.replace(hour=9, minute=0, second=0, microsecond=0)
          wait = (tgt - bj).total_seconds()

          if wait <= 0:
              print(f"当前北京 {bj:%H:%M}，已过 09:00，立即开始（说明本次延迟较大）")
              sys.exit(0)
          if wait > MAX_WAIT:
              print(f"距目标还有 {wait/60:.0f} 分钟，超过等待上限，立即开始")
              sys.exit(0)

          print(f"当前北京 {bj:%H:%M}，等待 {wait:.0f} 秒（{wait/60:.0f} 分钟）到 09:00")
          time.sleep(int(wait))
          bj2 = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=8)
          print(f"已到北京时间 {bj2:%H:%M}，开始拉昨日数据")
          PY

      - name: 昨日早报是否已推送（独立幂等锁，与晚报互不干扰）
        id: dup
        if: github.event.inputs.dry_run != 'true'
        run: |
          git fetch -q origin main || true
          if git cat-file -e "origin/main:reports/.sent-am-$RPT_DATE" 2>/dev/null; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::$RPT_DATE 的晨间复核已推送过，本次跳过（避免群里收到两遍）"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
            echo "$RPT_DATE 的晨间复核尚未推送，继续"
          fi

      - name: 生成日报图（重新拉取昨日全量数据）
        if: steps.dup.outputs.skip != '1'
        env:
          MODA_ACCOUNT: ${{ secrets.MODA_ACCOUNT }}
          MODA_PASSWORD: ${{ secrets.MODA_PASSWORD }}
        run: |
          # 偶发网络抖动导致整份日报失败太亏，失败歇 30 秒再试一次
          python daily_report.py "$RPT_DATE" || {
            echo "::warning::首次生成失败，30 秒后自动重试"
            sleep 30
            python daily_report.py "$RPT_DATE"
          }

      - name: 归档图片供 CDN 分发
        if: steps.dup.outputs.skip != '1' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "daily-report-bot"
          git config user.email "bot@users.noreply.github.com"

          ok=0
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p reports
            cp -f output/report_*.png reports/
            # 只保留最近 14 天，避免仓库无限膨胀
            ls -1t reports/*.png 2>/dev/null | tail -n +57 | xargs -r rm -f
            # 晨间复核用独立标记：.sent-am-日期（晚报的是 .sent-日期）
            touch "reports/.sent-am-$RPT_DATE"
            ls -1 reports/.sent-am-* 2>/dev/null | head -n -14 | xargs -r rm -f
            git add -A reports
            if git diff --cached --quiet; then
              echo "第 $i 次：远端已有这些图，无需提交"
              ok=1
              break
            fi
            git commit -q -m "晨间复核图 $RPT_DATE"
            if git push -q origin main; then
              echo "第 $i 次：推送成功"
              ok=1
              break
            fi
            echo "第 $i 次推送被拒，5 秒后重试…"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::图片没能提交到仓库，CDN 取不到图，本次不发"
            exit 1
          fi

          echo "IMAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "reports 目录现有 $(ls -1 reports/*.png | wc -l) 张图"

      - name: 推送到钉钉群（标题带「晨间复核」区分）
        if: steps.dup.outputs.skip != '1' && github.event.inputs.dry_run != 'true'
        env:
          DINGTALK_WEBHOOK_TOKEN: ${{ secrets.DINGTALK_WEBHOOK_TOKEN }}
          # 第二个群（惠州流程执行群A）的机器人 token；没配就只发主群
          DINGTALK_WEBHOOK_TOKEN2: ${{ secrets.DINGTALK_WEBHOOK_TOKEN2 }}
          DINGTALK_WEBHOOK_SECRET: ${{ secrets.DINGTALK_WEBHOOK_SECRET }}
          TITLE_SUFFIX: '·晨间复核'
        run: python cloud/push_cloud.py "$RPT_DATE"

      # 任何一步失败都要出声音，否则就是"群里没收到、也没人知道"
      - name: 失败告警
        if: failure()
        env:
          DINGTALK_WEBHOOK_TOKEN: ${{ secrets.DINGTALK_WEBHOOK_TOKEN }}
          DINGTALK_WEBHOOK_SECRET: ${{ secrets.DINGTALK_WEBHOOK_SECRET }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python cloud/alert.py
